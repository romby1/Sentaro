<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../docs/site.css">
<style>
  /* The link-preview card, docs/og.png: open this file in Chrome at 1200 × 630
     (DevTools device toolbar) and capture the screenshot. */
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .og .glow { height: 630px; background:
      radial-gradient(55% 55% at 50% 78%, rgba(237, 177, 89, 0.22), transparent 70%),
      radial-gradient(120% 70% at 50% 108%, transparent 60%, rgba(237, 177, 89, 0.07) 61%, transparent 64%); }
  .og-top { position: absolute; inset: 44px 56px auto; display: flex; align-items: center; gap: 12px; }
  .og-top .brand { font-size: 24px; gap: 12px; }
  .og-top .brand img { width: 32px; height: 32px; }
  .og-top .pill { height: 32px; padding: 0 14px; font-size: 15px; }
  .og-copy { position: absolute; top: 118px; left: 0; right: 0; display: grid; justify-items: center; gap: 18px; text-align: center; }
  .og h1 { font-size: 74px; line-height: 1; max-width: none; }
  .og .lede { font-size: 22px; max-width: none; }
  .og .venues { gap: 10px 26px; }
  .og .venue { font-size: 17px; }
  .og .venue img { width: 22px; height: 22px; }
  .og-shot {
    position: absolute; left: 50%; top: 430px; width: 980px; margin-left: -490px; height: 320px;
    border-radius: 14px; overflow: hidden; background: var(--raised);
    box-shadow: 0 0 0 1px var(--line-strong), 0 -20px 60px -20px rgba(237, 177, 89, 0.25);
  }
  .og-shot img { width: 100%; }
  .og-url { position: absolute; right: 56px; top: 50px; color: var(--muted); font: 500 18px var(--mono); }
</style>
</head>
<body>
<div class="og">
  <div class="glow"></div>
  <div class="og-top">
    <span class="brand"><img src="../docs/img/mark.png" alt="">Sentaro</span>
    <span class="spacer"></span>
  </div>
  <span class="og-url">sentaro.trade</span>
  <div class="og-copy">
    <span class="pill"><span class="dot"></span><b>Free</b> for everyone during the beta</span>
    <h1>The whole market, <em>one screen.</em></h1>
    <p class="lede">Live crypto screener · in your browser or on Windows</p>
    <div class="venues">
      <span class="venue"><img src="../docs/logos/binance.png" alt="">Binance</span>
      <span class="venue"><img class="invert" src="../docs/logos/bybit.png" alt="">Bybit</span>
      <span class="venue"><img class="invert" src="../docs/logos/okx.png" alt="">OKX</span>
      <span class="venue"><img src="../docs/logos/gateio.png" alt="">Gate</span>
      <span class="venue"><img src="../docs/logos/hyperliquid.png" alt="">Hyperliquid</span>
    </div>
  </div>
  <div class="og-shot"><img src="../docs/img/monitor.webp" alt=""></div>
</div>
</body>
</html>
